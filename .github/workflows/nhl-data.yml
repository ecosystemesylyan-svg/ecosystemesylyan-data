name: Donnees NHL EcosystemeSylyan

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date NHL (AAAA-MM-JJ)"
        required: false
        type: string
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  nhl:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Recuperer les donnees NHL
        run: |
          mkdir -p nhl
          mkdir -p nhl/boxscores
          mkdir -p nhl/playbyplay

          INPUT_DATE="${{ inputs.date || '' }}"

          if [ -n "$INPUT_DATE" ]; then
            DATES="$INPUT_DATE"
          else
            TODAY=$(TZ=America/Toronto date +%F)
            YESTERDAY=$(TZ=America/Toronto date -d 'yesterday' +%F)
            DATES="$TODAY $YESTERDAY"
          fi

          for DATE in $DATES; do
            echo "Mise a jour NHL : $DATE"

            curl --fail --retry 3 "https://api-web.nhle.com/v1/score/$DATE" -o "nhl/$DATE.json"

            jq -r '.games[]?.id' "nhl/$DATE.json" | while read -r GAME_ID; do
              curl --fail --retry 3 "https://api-web.nhle.com/v1/gamecenter/$GAME_ID/boxscore" -o "nhl/boxscores/$GAME_ID.json"
            done

            # Jeu par jeu (mises au jeu, mises en echec, etc.)
            # Seulement pour les matchs termines, pour ne pas alourdir le depot.
            # Un echec ici n'arrete jamais le reste de la mise a jour.
            jq -r '.games[]? | select(.gameState == "OFF" or .gameState == "FINAL") | .id' "nhl/$DATE.json" | while read -r GAME_ID; do
              if curl --fail --retry 3 "https://api-web.nhle.com/v1/gamecenter/$GAME_ID/play-by-play" -o "/tmp/pbp-$GAME_ID.json"; then
                mv "/tmp/pbp-$GAME_ID.json" "nhl/playbyplay/$GAME_ID.json"
              else
                echo "Jeu par jeu indisponible pour le match $GAME_ID"
              fi
            done
          done

          # Rattrapage : matchs de saison ou de series deja termines
          # dont le jeu par jeu n'a jamais ete telecharge.
          for FICHIER in nhl/20??-??-??.json; do
            [ -f "$FICHIER" ] || continue

            jq -r '.games[]? | select((.gameType == 2 or .gameType == 3) and .gameState == "OFF") | .id' "$FICHIER" | while read -r GAME_ID; do
              [ -f "nhl/playbyplay/$GAME_ID.json" ] && continue

              if curl --fail --retry 3 "https://api-web.nhle.com/v1/gamecenter/$GAME_ID/play-by-play" -o "/tmp/pbp-$GAME_ID.json"; then
                mv "/tmp/pbp-$GAME_ID.json" "nhl/playbyplay/$GAME_ID.json"
                echo "Rattrapage du match $GAME_ID"
              else
                echo "Rattrapage impossible pour le match $GAME_ID"
              fi
            done
          done

          if [ -z "$INPUT_DATE" ]; then
            cp "nhl/$TODAY.json" nhl/today.json
          fi

      - name: Calculer les positions reelles
        continue-on-error: true
        run: |
          python3 - <<'PY'
          # Positions reelles des attaquants, selon les mises au jeu.
          #
          # Pour chaque attaquant, on regarde ses 5 derniers matchs joues
          # (saison reguliere et series) et on compte les mises au jeu prises.
          #
          #   classe centre, moins de 2 par match  -> "centre_aile"   (joue a l'aile)
          #   classe ailier, 5 ou plus par match   -> "ailier_centre" (joue au centre)
          #   sinon                                -> "officiel"
          #
          # Moins de 3 matchs joues : pas assez de donnees -> "officiel".

          import glob
          import json
          import os

          MATCHS = 5
          MIN_MATCHS = 3
          SEUIL_AILE = 2.0
          SEUIL_CENTRE = 5.0

          def charger(chemin):
              try:
                  with open(chemin, encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          def a_joue(toi):
              return str(toi or "").strip() not in ("", "0:00", "00:00")

          historique = {}
          infos = {}
          dernier_match = ""

          for chemin in sorted(glob.glob("nhl/playbyplay/*.json")):
              pbp = charger(chemin)

              if not isinstance(pbp, dict):
                  continue

              if pbp.get("gameType") not in (2, 3):
                  continue

              if pbp.get("gameState") not in ("OFF", "FINAL"):
                  continue

              match_id = int(pbp.get("id") or 0)
              date = str(pbp.get("gameDate") or "")

              if not match_id or not date:
                  continue

              dernier_match = max(dernier_match, date)

              equipes = {}
              for cote in ("awayTeam", "homeTeam"):
                  equipe = pbp.get(cote) or {}
                  equipes[equipe.get("id")] = equipe.get("abbrev", "")

              prises = {}
              gagnees = {}

              for jeu in pbp.get("plays") or []:
                  if jeu.get("typeDescKey") != "faceoff":
                      continue

                  details = jeu.get("details") or {}
                  gagnant = details.get("winningPlayerId")
                  perdant = details.get("losingPlayerId")

                  if gagnant:
                      prises[gagnant] = prises.get(gagnant, 0) + 1
                      gagnees[gagnant] = gagnees.get(gagnant, 0) + 1

                  if perdant:
                      prises[perdant] = prises.get(perdant, 0) + 1

              # Attaquants qui ont reellement joue (temps de glace du sommaire).
              joueurs_du_match = {}
              sommaire = charger("nhl/boxscores/%d.json" % match_id)

              if isinstance(sommaire, dict):
                  stats = sommaire.get("playerByGameStats") or {}

                  for cote in ("awayTeam", "homeTeam"):
                      abbrev = (sommaire.get(cote) or {}).get("abbrev", "")

                      for j in (stats.get(cote) or {}).get("forwards") or []:
                          if not a_joue(j.get("toi")):
                              continue

                          joueurs_du_match[j.get("playerId")] = {
                              "pos": j.get("position", ""),
                              "equipe": abbrev,
                          }

              noms = {}
              for spot in pbp.get("rosterSpots") or []:
                  pid = spot.get("playerId")
                  prenom = (spot.get("firstName") or {}).get("default", "")
                  nom = (spot.get("lastName") or {}).get("default", "")
                  noms[pid] = (prenom + " " + nom).strip()

                  # Secours si le sommaire manque.
                  if not isinstance(sommaire, dict) and spot.get("positionCode") in ("C", "L", "R"):
                      joueurs_du_match[pid] = {
                          "pos": spot.get("positionCode"),
                          "equipe": equipes.get(spot.get("teamId"), ""),
                      }

              for pid, j in joueurs_du_match.items():
                  if not pid or j["pos"] not in ("C", "L", "R"):
                      continue

                  historique.setdefault(pid, []).append(
                      (date, match_id, prises.get(pid, 0), gagnees.get(pid, 0))
                  )

                  precedent = infos.get(pid)
                  if precedent is None or (date, match_id) >= precedent["cle"]:
                      infos[pid] = {
                          "cle": (date, match_id),
                          "pos": j["pos"],
                          "equipe": j["equipe"],
                          "nom": noms.get(pid, ""),
                      }

          joueurs = {}

          for pid, matchs in historique.items():
              recents = sorted(matchs, reverse=True)[:MATCHS]
              mj = len(recents)
              total = sum(m[2] for m in recents)
              gagne = sum(m[3] for m in recents)
              moyenne = round(total / mj, 2) if mj else 0.0
              pos = infos[pid]["pos"]

              statut = "officiel"

              if mj >= MIN_MATCHS:
                  if pos == "C" and moyenne < SEUIL_AILE:
                      statut = "centre_aile"
                  elif pos in ("L", "R") and moyenne >= SEUIL_CENTRE:
                      statut = "ailier_centre"

              joueurs[str(pid)] = {
                  "nom": infos[pid]["nom"],
                  "equipe": infos[pid]["equipe"],
                  "pos": pos,
                  "matchs": mj,
                  "misesAuJeu": total,
                  "gagnees": gagne,
                  "moyenne": moyenne,
                  "statut": statut,
              }

          resultat = {
              "dernierMatch": dernier_match,
              "regle": {
                  "matchs": MATCHS,
                  "minMatchs": MIN_MATCHS,
                  "seuilAile": SEUIL_AILE,
                  "seuilCentre": SEUIL_CENTRE,
              },
              "joueurs": dict(sorted(joueurs.items(), key=lambda kv: int(kv[0]))),
          }

          os.makedirs("nhl", exist_ok=True)

          with open("nhl/positions.json", "w", encoding="utf-8") as f:
              json.dump(resultat, f, ensure_ascii=False, indent=1)
              f.write("\n")

          print("Positions calculees pour", len(joueurs), "attaquants")
          PY

      - name: Calculer les totaux de carriere
        continue-on-error: true
        run: |
          python3 - <<'PY'
          # Totaux de carriere de tous les patineurs de l'histoire de la NHL
          # (saison reguliere), avec un indicateur "actif".
          #
          # Sert a calculer le rang en carriere d'un joueur, parmi tous les
          # joueurs de l'histoire et parmi les joueurs actifs.
          #
          # Refait une seule fois par jour : ces totaux bougent lentement.

          import datetime
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          import zoneinfo

          SORTIE = "nhl/carriere.json"
          BASE = "https://api.nhle.com/stats/rest/en/skater/summary"

          maintenant = datetime.datetime.now(zoneinfo.ZoneInfo("America/Toronto"))
          aujourdhui = maintenant.strftime("%Y-%m-%d")

          try:
              with open(SORTIE, encoding="utf-8") as f:
                  if json.load(f).get("genere") == aujourdhui:
                      print("Totaux de carriere deja a jour pour", aujourdhui)
                      sys.exit(0)
          except Exception:
              pass

          def appel(params):
              url = BASE + "?" + urllib.parse.urlencode(params)
              requete = urllib.request.Request(url, headers={
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0 AnalysteDeSports",
              })
              with urllib.request.urlopen(requete, timeout=120) as reponse:
                  return json.load(reponse)

          def tout_charger(agrege, filtre):
              """Charge toutes les lignes d'un rapport, d'un coup si possible, sinon par pages."""
              commun = {
                  "isAggregate": "true" if agrege else "false",
                  "isGame": "false",
                  "sort": "playerId",
                  "dir": "ASC",
                  "cayenneExp": filtre,
              }

              premier = appel(dict(commun, start=0, limit=-1))
              lignes = list(premier.get("data") or [])
              total = int(premier.get("total") or len(lignes))

              pages = 0
              while len(lignes) < total and pages < 400:
                  page = appel(dict(commun, start=len(lignes), limit=100))
                  morceau = page.get("data") or []
                  if not morceau:
                      break
                  lignes.extend(morceau)
                  pages += 1

              return lignes

          annee = maintenant.year if maintenant.month >= 7 else maintenant.year - 1
          saison_courante = "%d%d" % (annee, annee + 1)
          saison_precedente = "%d%d" % (annee - 1, annee)

          # Joueurs actifs : ont joue cette saison ou la precedente.
          equipes = {}
          for saison in (saison_precedente, saison_courante):
              for ligne in tout_charger(False, "gameTypeId=2 and seasonId=" + saison):
                  pid = ligne.get("playerId")
                  if pid:
                      dernieres = str(ligne.get("teamAbbrevs") or "").split(",")
                      equipes[pid] = dernieres[-1].strip()

          carriere = tout_charger(True, "gameTypeId=2")

          if len(carriere) < 1000:
              print("Reponse incomplete (%d joueurs), fichier non modifie" % len(carriere))
              sys.exit(1)

          CHAMPS = [
              ("gamesPlayed", "gamesPlayed"),
              ("goals", "goals"),
              ("assists", "assists"),
              ("points", "points"),
              ("plusMinus", "plusMinus"),
              ("pim", "penaltyMinutes"),
              ("shots", "shots"),
              ("powerPlayGoals", "ppGoals"),
              ("powerPlayPoints", "ppPoints"),
              ("shorthandedGoals", "shGoals"),
              ("gameWinningGoals", "gameWinningGoals"),
          ]

          joueurs = []
          vus = set()

          for ligne in carriere:
              pid = ligne.get("playerId")
              if not pid or pid in vus:
                  continue
              vus.add(pid)

              joueurs.append(
                  [
                      pid,
                      ligne.get("skaterFullName") or "",
                      ligne.get("positionCode") or "",
                      1 if pid in equipes else 0,
                      equipes.get(pid, ""),
                  ]
                  + [ligne.get(source) for _, source in CHAMPS]
              )

          joueurs.sort(key=lambda j: j[0])

          resultat = {
              "genere": aujourdhui,
              "saisonCourante": saison_courante,
              "colonnes": ["id", "nom", "pos", "actif", "equipe"] + [nom for nom, _ in CHAMPS],
              "joueurs": joueurs,
          }

          os.makedirs("nhl", exist_ok=True)
          with open(SORTIE, "w", encoding="utf-8") as f:
              json.dump(resultat, f, ensure_ascii=False, separators=(",", ":"))
              f.write("\n")

          print(
              "Totaux de carriere :", len(joueurs), "joueurs dont",
              sum(1 for j in joueurs if j[3]), "actifs",
          )
          PY

      - name: Calculer les statistiques de la saison
        continue-on-error: true
        run: |
          python3 - <<'PY'
          # Statistiques de la saison de chaque patineur, calculees a partir
          # des sommaires de match deja ranges dans nhl/boxscores.
          #
          # Sert a l'ordinateur de DG Amusant pour former ses equipes selon
          # la production reelle des joueurs (jamais de hasard).
          #
          # "actif" = le joueur a joue dans le plus recent match de son equipe.

          import glob
          import json
          import os

          def charger(chemin):
              try:
                  with open(chemin, encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          def secondes(toi):
              try:
                  minutes, sec = str(toi or "0:00").split(":")
                  return int(minutes) * 60 + int(sec)
              except Exception:
                  return 0

          matchs = []
          for chemin in glob.glob("nhl/boxscores/*.json"):
              b = charger(chemin)
              if not isinstance(b, dict):
                  continue
              if b.get("gameType") != 2 or b.get("gameState") not in ("OFF", "FINAL"):
                  continue
              matchs.append(b)

          if not matchs:
              print("Aucun match de saison termine, fichier non modifie")
              raise SystemExit(0)

          saison = max(int(b.get("season") or 0) for b in matchs)
          matchs = [b for b in matchs if int(b.get("season") or 0) == saison]
          matchs.sort(key=lambda b: (str(b.get("gameDate") or ""), int(b.get("id") or 0)))

          # Noms complets, quand on les connait.
          noms = {}
          carriere = charger("nhl/carriere.json")
          if isinstance(carriere, dict):
              colonnes = carriere.get("colonnes") or []
              if "id" in colonnes and "nom" in colonnes:
                  i_id, i_nom = colonnes.index("id"), colonnes.index("nom")
                  for j in carriere.get("joueurs") or []:
                      noms[j[i_id]] = j[i_nom]

          joueurs = {}
          dernier_match_equipe = {}
          dernier_match = ""

          for b in matchs:
              cle = (str(b.get("gameDate") or ""), int(b.get("id") or 0))
              dernier_match = max(dernier_match, cle[0])
              stats = b.get("playerByGameStats") or {}

              for cote in ("awayTeam", "homeTeam"):
                  equipe = (b.get(cote) or {}).get("abbrev", "")
                  if not equipe:
                      continue

                  dernier_match_equipe[equipe] = cle
                  bloc = stats.get(cote) or {}

                  for groupe in ("forwards", "defense"):
                      for p in bloc.get(groupe) or []:
                          pid = p.get("playerId")
                          toi = secondes(p.get("toi"))
                          pos = p.get("position") or ""

                          if not pid or toi <= 0 or pos not in ("C", "L", "R", "D"):
                              continue

                          j = joueurs.setdefault(pid, {
                              "pj": 0, "buts": 0, "passes": 0, "toi": 0,
                          })
                          j["pj"] += 1
                          j["buts"] += int(p.get("goals") or 0)
                          j["passes"] += int(p.get("assists") or 0)
                          j["toi"] += toi
                          # Les matchs sont en ordre : la derniere valeur est la plus recente.
                          j["equipe"] = equipe
                          j["pos"] = pos
                          j["dernier"] = cle
                          j["nomCourt"] = (p.get("name") or {}).get("default", "")

          liste = []
          for pid, j in joueurs.items():
              liste.append({
                  "id": pid,
                  "nom": noms.get(pid) or j["nomCourt"],
                  "equipe": j["equipe"],
                  "pos": j["pos"],
                  "pj": j["pj"],
                  "buts": j["buts"],
                  "passes": j["passes"],
                  "points": j["buts"] + j["passes"],
                  "toiMoyen": round(j["toi"] / j["pj"]),
                  "actif": 1 if j["dernier"] == dernier_match_equipe.get(j["equipe"]) else 0,
              })

          liste.sort(key=lambda j: j["id"])

          resultat = {
              "saison": str(saison),
              "dernierMatch": dernier_match,
              "joueurs": liste,
          }

          os.makedirs("nhl", exist_ok=True)
          with open("nhl/saison.json", "w", encoding="utf-8") as f:
              json.dump(resultat, f, ensure_ascii=False, separators=(",", ":"))
              f.write("\n")

          print("Statistiques de saison :", len(liste), "patineurs,",
                sum(j["actif"] for j in liste), "actifs")
          PY

      - name: Sauvegarder les donnees
        run: |
          git config user.name "EcosystemeSylyan NHL Bot"
          git config user.email "actions@github.com"
          git add nhl/
          git diff --cached --quiet && exit 0
          git commit -m "Mise a jour NHL"
          git push
